name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Write project files
        run: |
          mkdir -p $(dirname settings.gradle.kts)
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "MediaTV"
          EOF
          mkdir -p $(dirname gradle.properties)
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF
          mkdir -p $(dirname build.gradle.kts)
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2"
              id("org.jetbrains.kotlin.android") version "1.9.24"
          }
          android {
              namespace = "com.media.tv"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.media.tv"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF
          mkdir -p $(dirname src/main/AndroidManifest.xml)
          cat > src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <application
                  android:label="Media TV"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">
                  <activity android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          mkdir -p $(dirname src/main/java/com/media/tv/MainActivity.kt)
          cat > src/main/java/com/media/tv/MainActivity.kt <<'EOF'
          package com.media.tv

          import android.annotation.SuppressLint
          import android.app.Activity
          import android.content.ActivityNotFoundException
          import android.content.Intent
          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.view.View
          import android.webkit.JavascriptInterface
          import android.webkit.WebChromeClient
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient

          class MainActivity : Activity() {

              private lateinit var web: WebView

              inner class Bridge {
                  @JavascriptInterface
                  fun play(url: String, title: String) {
                      runOnUiThread { openInPlayer(url, title) }
                  }
              }

              @Suppress("DEPRECATION")
              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.decorView.systemUiVisibility = (View.SYSTEM_UI_FLAG_FULLSCREEN
                      or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      or View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      or View.SYSTEM_UI_FLAG_LAYOUT_STABLE)

                  web = WebView(this)
                  web.setBackgroundColor(Color.parseColor("#0c0b11"))
                  val s = web.settings
                  s.javaScriptEnabled = true
                  s.domStorageEnabled = true
                  s.allowFileAccess = true
                  s.allowFileAccessFromFileURLs = true
                  s.allowUniversalAccessFromFileURLs = true
                  s.mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW
                  web.isFocusable = true
                  web.isFocusableInTouchMode = true
                  web.webViewClient = WebViewClient()
                  web.webChromeClient = WebChromeClient()
                  web.addJavascriptInterface(Bridge(), "Android")
                  setContentView(web)
                  web.loadUrl("file:///android_asset/index.html")
              }

              private fun openInPlayer(url: String, title: String) {
                  val i = Intent(Intent.ACTION_VIEW)
                  i.setDataAndType(Uri.parse(url), "video/*")
                  i.putExtra("title", title)
                  try {
                      startActivity(Intent.createChooser(i, title))
                  } catch (e: ActivityNotFoundException) {
                  }
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  web.evaluateJavascript("!!(window.onBack&&window.onBack())") { r ->
                      if (r != "true") finish()
                  }
              }
          }
          EOF
          mkdir -p $(dirname src/main/assets/index.html)
          cat > src/main/assets/index.html <<'EOF'
          <!doctype html><html><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Media TV</title>
          <style>
          :root{--bg:#0c0b11;--card:#1a1826;--acc:#7b5bf5;--mu:#9a98a8}
          *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
          html,body{margin:0;background:var(--bg);color:#f2f2f7;font-family:-apple-system,Roboto,Helvetica,sans-serif}
          #nav{position:sticky;top:0;z-index:5;display:flex;gap:4px;align-items:center;padding:10px 12px;background:rgba(12,11,17,.94);overflow-x:auto}
          .tab{padding:8px 14px;border-radius:20px;color:var(--mu);cursor:pointer;white-space:nowrap}
          .tab.on,.tab:focus{background:var(--acc);color:#fff;outline:none}
          #q{flex:1;min-width:110px;max-width:300px;margin-left:auto;background:var(--card);border:0;border-radius:20px;color:#fff;padding:9px 14px;font-size:15px}
          .hero{height:44vh;min-height:230px;background-size:cover;background-position:center top;position:relative;display:flex;align-items:flex-end}
          .hero:after,.det:before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#0c0b11 6%,rgba(12,11,17,.55))}
          .hero .in{position:relative;z-index:1;padding:18px;max-width:620px}
          h1.t{margin:0 0 6px;font-size:26px}
          .ds{color:#d0cfdc;font-size:14px;line-height:1.45}
          .mu{color:var(--mu);font-size:13px;margin:4px 0}
          .row{padding:14px 12px 0}.row h2{font-size:18px;margin:0 0 10px;display:flex;justify-content:space-between}
          .row h2 span{font-size:13px;color:var(--acc);cursor:pointer}
          .strip{display:flex;gap:12px;overflow-x:auto;padding:6px 4px 12px;scrollbar-width:none}
          .strip::-webkit-scrollbar{display:none}
          .card{flex:0 0 auto;width:118px;cursor:pointer;transition:transform .15s}
          .card:focus,.card:hover{transform:scale(1.07);outline:none}
          .card:focus .poster{outline:3px solid var(--acc)}
          .poster{width:100%;aspect-ratio:2/3;border-radius:10px;background:var(--card) center/cover;display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;padding:6px;color:var(--mu)}
          .cn{font-size:12px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
          .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:16px;padding:14px}
          .grid .card{width:auto}
          .btn{display:inline-block;background:var(--acc);color:#fff;border:0;border-radius:10px;padding:11px 20px;font-size:15px;margin:8px 8px 0 0;cursor:pointer}
          .btn.g{background:var(--card)}.btn:focus{outline:2px solid #fff}
          .det{position:relative;min-height:100vh;background-size:cover;background-position:center top}
          .det .w{position:relative;z-index:1;padding:18px;display:flex;gap:18px;flex-wrap:wrap}
          .dp{width:130px;flex:0 0 130px}.di{flex:1;min-width:230px}
          .chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
          .chip{padding:7px 14px;border-radius:16px;background:var(--card);cursor:pointer}
          .chip.on,.chip:focus{background:var(--acc);outline:none}
          .ep{display:flex;gap:12px;background:rgba(26,24,38,.85);border-radius:12px;padding:8px;margin:8px 0;cursor:pointer;width:100%}
          .ep:focus{outline:2px solid var(--acc)}
          .et{width:112px;height:63px;border-radius:8px;background:#26233a center/cover;flex:0 0 112px}
          .ei{font-size:14px;overflow:hidden}
          .pad{padding:16px}.pad h2,.pad h3{margin:18px 0 6px}
          .in2{width:100%;max-width:420px;background:var(--card);border:0;border-radius:10px;color:#fff;padding:12px;font-size:15px}
          .lib{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border-radius:10px;padding:8px 12px;margin:6px 0;font-size:13px;word-break:break-all}
          .fold{background:var(--card);border-radius:10px;padding:13px 14px;margin:7px 0;cursor:pointer}
          .fold:focus{outline:2px solid var(--acc)}
          #st{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#2c2940;border-radius:20px;padding:9px 18px;font-size:13px;display:none;z-index:9}
          #modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:10;display:flex;align-items:center;justify-content:center}
          #modal[hidden]{display:none}
          #modal .box{background:#1a1826;border-radius:16px;padding:16px;width:min(92%,420px);max-height:80vh;overflow:auto}
          </style></head><body>
          <div id="nav">
          <span class="tab" tabindex="0" data-a="tab" data-v="home">Home</span>
          <span class="tab" tabindex="0" data-a="tab" data-v="movie">Movies</span>
          <span class="tab" tabindex="0" data-a="tab" data-v="series">Series</span>
          <span class="tab" tabindex="0" data-a="tab" data-v="settings">&#9881;</span>
          <input id="q" placeholder="Search">
          </div>
          <div id="c"></div><div id="st"></div><div id="modal" hidden></div>
          <script>
          //PURE
          const VEXT=/\.(mp4|mkv|avi|mov|webm|m4v|ts|wmv|flv)$/i;
          function cleanTitle(n){
            n=n.replace(/[._]+/g,' ').replace(/\[[^\]]*\]/g,' ');
            const cut=n.search(/\s(?:19|20)\d{2}(?:\s|\)|$)|\((?:19|20)\d{2}\)|\b(?:2160p|1080p|720p|480p|4k|web[ -]?dl|webrip|bluray|brrip|hdrip|hdtc|dvdrip|x26[45]|hevc)\b/i);
            if(cut>0)n=n.slice(0,cut);
            return n.replace(/[()\-\s]+$/,'').replace(/\s+/g,' ').trim();
          }
          function yearOf(n){const m=n.match(/(?:^|[ .(\[_-])((?:19|20)\d{2})(?=[ .)\]_-]|$)/);return m?m[1]:null}
          const isSeasonDir=s=>/season|^s\d{1,2}$/i.test(s);
          function parse(f){
            let segs;try{segs=decodeURIComponent(new URL(f.url).pathname).split('/').filter(Boolean)}catch(e){segs=new URL(f.url).pathname.split('/').filter(Boolean)}
            const name=segs.pop().replace(VEXT,'');
            let m=name.match(/[sS](\d{1,2})[ ._-]*[eE](\d{1,3})/)||name.match(/\b(\d{1,2})x(\d{2,3})\b/);
            let season,ep;
            if(m){season=+m[1];ep=+m[2]}
            else{
              const sf=segs.slice().reverse().find(isSeasonDir);
              const em=name.match(/(?:^|[ ._-])(?:e|ep|episode)[ ._-]*(\d{1,3})(?!\d)/i);
              if(sf&&em){season=+((sf.match(/\d+/)||[1])[0]);ep=+em[1]}
            }
            const q=(name.match(/2160p|4k|1080p|720p|480p/i)||['SD'])[0].toUpperCase();
            if(season!=null){
              let title=cleanTitle(m?name.slice(0,m.index):'');
              if(title.length<2){
                const idx=segs.map(isSeasonDir).lastIndexOf(true);
                title=cleanTitle(idx>0?segs[idx-1]:(segs[segs.length-1]||''));
              }
              return{type:'series',title,year:null,season,ep,q,url:f.url,name};
            }
            let t=cleanTitle(name),y=yearOf(name);
            if(t.length<2){const fo=segs[segs.length-1]||'';t=cleanTitle(fo);y=yearOf(fo)}
            return{type:'movie',title:t,year:y,q,url:f.url,name};
          }
          function build(files){
            const map=new Map();
            files.forEach(f=>{
              const p=parse(f);if(!p.title)return;
              const k=p.type+'|'+p.title.toLowerCase()+(p.type=='movie'?'|'+(p.year||''):'');
              let it=map.get(k);
              if(!it){it={key:k,type:p.type,title:p.title,year:p.year,files:[],eps:{}};map.set(k,it)}
              const fl={url:p.url,q:p.q,name:p.name};
              if(p.type=='movie')it.files.push(fl);
              else{const ek=p.season+'x'+p.ep;(it.eps[ek]=it.eps[ek]||[]).push(fl)}
            });
            return [...map.values()].sort((a,b)=>a.title.localeCompare(b.title));
          }
          //ENDPURE
          const $=s=>document.querySelector(s);
          const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
          const dec=u=>{try{return decodeURI(u)}catch(e){return u}};
          const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
          const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
          let cfg=ld('cfg',{root:'http://172.16.50.7/',libs:[]});
          let items=ld('items',[]),M=ld('meta',{}),FULL={},FULLP={},H=[{v:'home'}],seed=Math.random(),pend=[],ptitle='',scanning=false,season=0,enriching=false;
          const reidx=()=>items.forEach((x,i)=>x.ix=i);reidx();
          let tt;function st(t,ms){const e=$('#st');e.textContent=t;e.style.display=t?'block':'none';clearTimeout(tt);if(ms)tt=setTimeout(()=>e.style.display='none',ms)}

          async function list(url){
            const t=await (await fetch(url)).text();
            const d=new DOMParser().parseFromString(t,'text/html');const out=[],seen=new Set();
            d.querySelectorAll('a[href]').forEach(a=>{
              const h=a.getAttribute('href');if(!h||h[0]=='?'||h[0]=='#')return;
              let u;try{u=new URL(h,url)}catch(e){return}
              if(u.search||!u.href.startsWith(url)||u.href==url||seen.has(u.href))return;
              seen.add(u.href);
              let n=u.pathname.split('/').filter(Boolean).pop()||'';try{n=decodeURIComponent(n)}catch(e){}
              out.push({url:u.href,name:n,dir:u.pathname.endsWith('/')});
            });
            return out;
          }
          async function rescan(){
            if(scanning)return;
            if(!cfg.libs.length){show('settings',null,true);return}
            scanning=true;const files=[];const q=cfg.libs.map(u=>[u,4]);let act=0,dirs=0;
            await new Promise(res=>{
              const pump=()=>{
                while(act<6&&q.length&&files.length<8000){
                  const [u,d]=q.shift();act++;dirs++;
                  list(u).then(es=>es.forEach(e=>{if(e.dir){if(d>0)q.push([e.url,d-1])}else if(VEXT.test(e.name))files.push(e)}))
                  .catch(()=>{}).finally(()=>{act--;st('Scanning... '+files.length+' files, '+dirs+' folders');pump()});
                }
                if(!act&&(!q.length||files.length>=8000))res();
              };pump();
            });
            items=build(files);reidx();sv('items',items);scanning=false;
            st(items.length?'Found '+items.length+' titles':'No videos found. Check folders in Settings.',4000);
            render();enrich();
          }

          async function getMeta(it){
            if(M[it.key]!==undefined)return M[it.key];
            let r=null;
            try{
              const j=await (await fetch('https://v3-cinemeta.strem.io/catalog/'+it.type+'/top/search='+encodeURIComponent(it.title)+'.json')).json();
              const ms=j.metas||[];
              r=(it.year&&ms.find(m=>String(m.releaseInfo||m.year||'').startsWith(it.year)))||ms.find(m=>(m.name||'').toLowerCase()==it.title.toLowerCase())||ms[0]||null;
              if(r)r={id:r.id,poster:r.poster,bg:r.background,name:r.name,desc:r.description,year:r.releaseInfo||r.year,rating:r.imdbRating,genres:r.genres};
            }catch(e){return null}
            M[it.key]=r;return r;
          }
          async function enrich(){
            if(enriching)return;enriching=true;
            const todo=items.filter(i=>M[i.key]===undefined);let n=0;
            const w=async()=>{while(n<todo.length){const it=todo[n++];await getMeta(it);if(n%8==0){soon()}}};
            await Promise.all([w(),w(),w(),w()]);
            sv('meta',M);enriching=false;soon();
          }
          async function full(it){
            const m=M[it.key];if(!m||!m.id)return null;if(FULL[m.id])return FULL[m.id];
            try{const j=await (await fetch('https://v3-cinemeta.strem.io/meta/'+it.type+'/'+m.id+'.json')).json();return FULL[m.id]=j.meta||null}catch(e){return null}
          }
          let rt;const soon=()=>{clearTimeout(rt);rt=setTimeout(()=>{const v=H[H.length-1].v;if(v=='home'||v=='list'||v=='search')render(true)},1200)};

          const card=i=>{const m=M[i.key],p=m&&m.poster;
            return '<div class="card" tabindex="0" data-a="open" data-v="'+i.ix+'"><div class="poster" style="'+(p?"background-image:url('"+esc(p)+"')":'')+'">'+(p?'':esc(i.title))+'</div><div class="cn">'+esc((m&&m.name)||i.title)+'</div></div>'};
          const strip=(t,arr,type)=>arr.length?'<div class="row"><h2>'+t+'<span data-a="more" data-v="'+type+'">See all &rsaquo;</span></h2><div class="strip">'+arr.slice(0,24).map(card).join('')+'</div></div>':'';

          function vHome(){
            if(!items.length)return '<div class="pad"><h2>Welcome</h2><p class="ds">Choose the folders on your server that contain movies and series.</p><button class="btn" data-a="browse" data-v="'+esc(cfg.root)+'">Choose folders</button><button class="btn g" data-a="addroot">Scan whole server</button></div>';
            const mv=items.filter(i=>i.type=='movie'),sr=items.filter(i=>i.type=='series');
            const wb=items.filter(i=>M[i.key]&&M[i.key].bg);const h=wb.length?wb[Math.floor(seed*wb.length)]:null;let o='';
            if(h){const m=M[h.key];o+='<div class="hero" style="background-image:url(\''+esc(m.bg)+'\')"><div class="in"><h1 class="t">'+esc(m.name||h.title)+'</h1><div class="mu">'+esc([m.year,(m.genres||[]).slice(0,3).join(' • ')].filter(Boolean).join('  ·  '))+'</div><div class="ds">'+esc((m.desc||'').slice(0,170))+'</div><button class="btn" data-a="open" data-v="'+h.ix+'">Details</button></div></div>'}
            return o+strip('Movies',mv,'movie')+strip('Series',sr,'series');
          }
          function vList(type){const a=items.filter(i=>i.type==type);return '<div class="grid">'+a.slice(0,300).map(card).join('')+'</div>'+(a.length>300?'<div class="mu pad">Showing 300 of '+a.length+'. Use search.</div>':'')}
          function vSearch(q){const s=q.toLowerCase();const a=items.filter(i=>i.title.toLowerCase().includes(s)||((M[i.key]||{}).name||'').toLowerCase().includes(s));return a.length?'<div class="grid">'+a.slice(0,200).map(card).join('')+'</div>':'<div class="pad mu">Nothing found.</div>'}

          function vDetail(ix){
            const it=items[ix];if(!it)return '';
            const m=M[it.key]||{},f=m.id?FULL[m.id]:null;
            if(m.id&&!f&&!FULLP[m.id]){FULLP[m.id]=1;full(it).then(x=>{const s=H[H.length-1];if(x&&s.v=='detail'&&s.a==ix)render(true)})}
            f&&0;const F=f||{};
            const bg=F.background||m.bg||'',poster=F.poster||m.poster||'',desc=F.description||m.desc||'';
            const gen=(F.genres||F.genre||m.genres||[]).slice(0,4).join(' • ');
            const rt=F.imdbRating||m.rating;
            const meta=[m.year||it.year,F.runtime,rt?'\u2605 '+rt:''].filter(Boolean).join('  ·  ');
            let h='<div class="det" style="background-image:url(\''+esc(bg)+'\')"><div class="w"><div class="dp"><div class="poster" style="'+(poster?"background-image:url('"+esc(poster)+"')":'')+'">'+(poster?'':esc(it.title))+'</div></div><div class="di"><h1 class="t">'+esc(m.name||it.title)+'</h1><div class="mu">'+esc(meta)+'</div><div class="mu">'+esc(gen)+'</div><p class="ds">'+esc(desc)+'</p>';
            if(F.cast&&F.cast.length)h+='<div class="mu">Cast: '+esc(F.cast.slice(0,6).join(', '))+'</div>';
            if(it.type=='movie'){
              h+='<button class="btn" data-a="playmovie" data-v="'+ix+'">&#9654; Play</button><div class="mu">'+esc(it.files.map(x=>x.q).join(' / '))+'</div></div></div></div>';
              return h;
            }
            h+='</div></div><div class="w" style="padding-top:0">';
            const ss=[...new Set(Object.keys(it.eps).map(k=>+k.split('x')[0]))].sort((a,b)=>a-b);
            if(!ss.includes(season))season=ss[0];
            h+='<div style="width:100%"><div class="chips">'+ss.map(s=>'<span class="chip'+(s==season?' on':'')+'" tabindex="0" data-a="season" data-v="'+s+'">Season '+s+'</span>').join('')+'</div></div>';
            const vids=F.videos||[];
            Object.keys(it.eps).map(k=>k.split('x').map(Number)).filter(x=>x[0]==season).sort((a,b)=>a[1]-b[1]).forEach(([s,e])=>{
              const v=vids.find(v=>v.season==s&&(v.episode==e||v.number==e));
              h+='<div class="ep" tabindex="0" data-a="ep" data-v="'+ix+'|'+s+'|'+e+'"><div class="et" style="'+(v&&v.thumbnail?"background-image:url('"+esc(v.thumbnail)+"')":'')+'"></div><div class="ei"><b>'+e+'. '+esc((v&&(v.name||v.title))||'Episode '+e)+'</b><div class="mu">'+esc(it.eps[s+'x'+e].map(x=>x.q).join(' / '))+'</div></div></div>';
            });
            return h+'</div></div>';
          }

          function vSettings(){
            return '<div class="pad"><h2>Settings</h2><div class="mu">Server address</div><input id="root" class="in2" value="'+esc(cfg.root)+'"><br><button class="btn" data-a="saveroot">Save</button><h3>Library folders</h3>'+
            (cfg.libs.map((u,i)=>'<div class="lib"><span>'+esc(dec(u))+'</span><button class="btn g" data-a="rmlib" data-v="'+i+'">Remove</button></div>').join('')||'<div class="mu">None added yet.</div>')+
            '<button class="btn" data-a="browse" data-v="'+esc(cfg.root)+'">+ Add folder</button><button class="btn g" data-a="addroot">Add whole server</button><h3>Library</h3><div class="mu">'+items.length+' titles</div><button class="btn" data-a="rescan">&#8635; Rescan</button><button class="btn g" data-a="clear">Clear cache</button></div>';
          }
          function vBrowse(url){
            list(url).then(es=>{
              const s=H[H.length-1];if(s.v!='browse'||s.a!=url)return;
              const ds=es.filter(e=>e.dir),nf=es.filter(e=>VEXT.test(e.name)).length;
              let up='';try{const p=new URL('../',url).href;if(p.startsWith(cfg.root)&&p!=url)up='<div class="fold" tabindex="0" data-a="browse" data-v="'+esc(p)+'">&#11014; Up</div>'}catch(e){}
              $('#c').innerHTML='<div class="pad"><div class="mu">'+esc(dec(url))+'</div><button class="btn" data-a="addlib" data-v="'+esc(url)+'">Add this folder</button><div class="mu">'+nf+' videos here, '+ds.length+' subfolders</div>'+up+ds.map(d=>'<div class="fold" tabindex="0" data-a="browse" data-v="'+esc(d.url)+'">&#128193; '+esc(d.name)+'</div>').join('')+(es.length?'':'<div class="mu">Could not read this page. Is the server a normal folder listing?</div>')+'</div>';
            }).catch(()=>{$('#c').innerHTML='<div class="pad">Cannot reach the server. Make sure you are on the right Wi-Fi.<br><button class="btn" data-a="tab" data-v="settings">Settings</button></div>'});
            return '<div class="pad mu">Loading...</div>';
          }

          function render(keep){
            const s=H[H.length-1],y=scrollY;let h='';
            if(s.v=='home')h=vHome();else if(s.v=='list')h=vList(s.a);else if(s.v=='search')h=vSearch(s.a);
            else if(s.v=='detail')h=vDetail(s.a);else if(s.v=='settings')h=vSettings();else if(s.v=='browse')h=vBrowse(s.a);
            $('#c').innerHTML=h;
            const base=H[0];const cur=base.v=='list'?base.a:base.v;
            document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.v==cur));
            if(keep)scrollTo(0,y);
          }
          function show(v,a,reset){if(reset)H=[{v,a}];else H.push({v,a});render();if(!reset||1)scrollTo(0,0)}
          window.onBack=()=>{
            if(!$('#modal').hidden){$('#modal').hidden=true;return true}
            if(H.length>1){H.pop();render();return true}
            return false;
          };
          const go=(u,t)=>{if(window.Android)Android.play(u,t);else window.open(u)};
          function play(files,title){
            if(!files||!files.length)return;
            if(files.length==1)return go(files[0].url,title);
            pend=files;ptitle=title;
            $('#modal').innerHTML='<div class="box"><b>'+esc(title)+'</b>'+files.map((f,i)=>'<div class="fold" tabindex="0" data-a="p" data-v="'+i+'"><b>'+esc(f.q)+'</b><div class="mu">'+esc(f.name)+'</div></div>').join('')+'<button class="btn g" data-a="cm">Cancel</button></div>';
            $('#modal').hidden=false;
          }
          function act(a,v,el){
            if(a=='tab'){$('#q').value='';if(v=='movie'||v=='series')show('list',v,true);else show(v,null,true)}
            else if(a=='open'){season=0;show('detail',+v)}
            else if(a=='more')show('list',v);
            else if(a=='playmovie'){const it=items[+v];play(it.files,it.title)}
            else if(a=='ep'){const [ix,s,e]=v.split('|');const it=items[+ix];play(it.eps[s+'x'+e],it.title+' S'+s+'E'+e)}
            else if(a=='season'){season=+v;render(true)}
            else if(a=='p'){$('#modal').hidden=true;go(pend[+v].url,ptitle)}
            else if(a=='cm')$('#modal').hidden=true;
            else if(a=='browse'){const t=H[H.length-1];if(t.v=='browse')H[H.length-1]={v:'browse',a:v};else H.push({v:'browse',a:v});render();scrollTo(0,0)}
            else if(a=='addlib'){if(!cfg.libs.includes(v))cfg.libs.push(v);sv('cfg',cfg);st('Added. Tap Rescan.',3000);show('settings',null,true)}
            else if(a=='rmlib'){cfg.libs.splice(+v,1);sv('cfg',cfg);render()}
            else if(a=='addroot'){cfg.libs=[cfg.root];sv('cfg',cfg);show('home',null,true);rescan()}
            else if(a=='saveroot'){let r=$('#root').value.trim();if(!/^https?:\/\//.test(r))r='http://'+r;if(!r.endsWith('/'))r+='/';cfg.root=r;cfg.libs=[];sv('cfg',cfg);st('Saved. Add folders again.',3000);render()}
            else if(a=='rescan')rescan();
            else if(a=='clear'){items=[];M={};FULL={};FULLP={};sv('items',[]);sv('meta',{});render();st('Cache cleared',2000)}
          }
          document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el)act(el.dataset.a,el.dataset.v,el)});
          document.addEventListener('keydown',e=>{if(e.key=='Enter'){const el=document.activeElement;if(el&&el.dataset&&el.dataset.a)el.click()}});
          $('#q').addEventListener('input',function(){const v=this.value.trim();H=v?[{v:'search',a:v}]:[{v:'home'}];render()});
          render();
          if(!items.length&&cfg.libs.length)rescan();else if(items.length)enrich();
          </script></body></html>
          EOF
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        run: gradle assembleDebug --no-daemon
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Media TV v${{ github.run_number }}
          files: build/outputs/apk/debug/*.apk
